name: Render

# Cloud export for a machine that cannot render locally.
# Renders any Remotion composition to MP4 on Linux with the latest Remotion and
# uploads the result as a downloadable artifact.
#
# Two modes:
#   full   - render the whole composition
#   range  - render only a frame range. With splice=true the range is spliced
#            into a previously rendered full file, so a small fix does not cost
#            a whole re-export. The splice is lossless: the base is given a
#            keyframe every second, the range is snapped outward to those
#            second boundaries, and the three pieces are joined with -c copy.

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id (see src/Root.tsx)"
        required: true
        default: "Minute1"
      mode:
        description: "full = whole composition, range = frames only"
        required: true
        default: "full"
        type: choice
        options: [full, range]
      start_frame:
        description: "range mode: first frame (inclusive)"
        required: false
        default: ""
      end_frame:
        description: "range mode: last frame (inclusive)"
        required: false
        default: ""
      splice:
        description: "range mode: splice into a previous full render"
        required: false
        default: false
        type: boolean
      base_run_id:
        description: "splice: run id of the Render run holding the base MP4"
        required: false
        default: ""
      crf:
        description: "Quality, lower is better (18 visually lossless, 23 default)"
        required: false
        default: "18"
      remotion_version:
        description: "Remotion version for this render ('latest' or e.g. 4.0.540)"
        required: false
        default: "latest"
      props:
        description: "Optional JSON passed to the composition as props"
        required: false
        default: ""

concurrency:
  group: render-${{ inputs.composition }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Chrome Headless Shell needs these on a bare Ubuntu runner.
      - name: Install Chrome system libraries and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-liberation
          # ffmpeg is used for the keyframe pass and the splice, not for rendering.
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm ci

      # The repo is pinned to 4.0.429 because that is the newest compositor that
      # loads on the author's macOS 12 machine. CI has no such limit, so it
      # renders with the latest Remotion unless a version is given.
      - name: Use requested Remotion version
        run: |
          V="${{ inputs.remotion_version }}"
          echo "Requested Remotion: $V"
          npm install --no-save \
            "remotion@$V" "@remotion/cli@$V" "@remotion/renderer@$V" \
            "@remotion/bundler@$V" "@remotion/fonts@$V" "@remotion/media-utils@$V"
          node -e "console.log('rendering with remotion', require('remotion/package.json').version)"

      - name: Ensure headless browser
        run: npx remotion browser ensure

      - name: Resolve render plan
        id: plan
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          COMP="${{ inputs.composition }}"
          FPS=$(node -e "
            const s=require('./src/data/scenes.json');
            console.log(s.meta.fps);
          ")
          echo "fps=$FPS" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "range" ]; then
            S="${{ inputs.start_frame }}"; E="${{ inputs.end_frame }}"
            if [ -z "$S" ] || [ -z "$E" ]; then
              echo "::error::range mode needs start_frame and end_frame"; exit 1
            fi
            if [ "${{ inputs.splice }}" = "true" ]; then
              # Snap outward to whole seconds so the cut lands on keyframes.
              S=$(( S / FPS * FPS ))
              E=$(( ( E / FPS + 1 ) * FPS - 1 ))
              echo "Snapped to keyframe boundaries: $S-$E"
            fi
            echo "frames=$S-$E" >> "$GITHUB_OUTPUT"
            echo "start=$S" >> "$GITHUB_OUTPUT"
            echo "end=$E" >> "$GITHUB_OUTPUT"
            echo "name=${COMP}_${S}-${E}" >> "$GITHUB_OUTPUT"
          else
            echo "frames=" >> "$GITHUB_OUTPUT"
            echo "name=${COMP}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render
        run: |
          set -euo pipefail
          mkdir -p out
          ARGS=(
            "${{ inputs.composition }}"
            "out/render.mp4"
            "--codec=h264"
            "--crf=${{ inputs.crf }}"
            "--log=info"
            "--timeout=180000"
            "--concurrency=2"
          )
          if [ -n "${{ steps.plan.outputs.frames }}" ]; then
            ARGS+=("--frames=${{ steps.plan.outputs.frames }}")
          fi
          if [ -n "${{ inputs.props }}" ]; then
            printf '%s' '${{ inputs.props }}' > out/props.json
            ARGS+=("--props=out/props.json")
          fi
          npx remotion render "${ARGS[@]}"

      # Re-encode once with a keyframe every second. This is what makes a later
      # -c copy splice exact; without it the cut points are wherever x264 chose.
      - name: Normalise keyframes
        run: |
          set -euo pipefail
          FPS=${{ steps.plan.outputs.fps }}
          ffmpeg -y -v error -i out/render.mp4 \
            -c:v libx264 -crf ${{ inputs.crf }} -preset medium \
            -g "$FPS" -keyint_min "$FPS" -sc_threshold 0 \
            -c:a copy -movflags +faststart \
            out/${{ steps.plan.outputs.name }}.mp4
          rm out/render.mp4
          ls -la out

      - name: Download base render for splice
        if: ${{ inputs.mode == 'range' && inputs.splice }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: base
          merge-multiple: true

      - name: Splice range into base
        if: ${{ inputs.mode == 'range' && inputs.splice }}
        run: |
          set -euo pipefail
          FPS=${{ steps.plan.outputs.fps }}
          S=${{ steps.plan.outputs.start }}
          E=${{ steps.plan.outputs.end }}
          PATCH=out/${{ steps.plan.outputs.name }}.mp4
          BASE=$(find base -name '*.mp4' | head -1)
          if [ -z "$BASE" ]; then echo "::error::no base mp4 in that run"; exit 1; fi
          echo "Base: $BASE"

          HEAD_END=$(node -e "console.log($S/$FPS)")
          TAIL_START=$(node -e "console.log(($E+1)/$FPS)")
          MID_LEN=$(node -e "console.log(($E-$S+1)/$FPS)")

          mkdir -p splice
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$BASE")
          HAS_TAIL=0
          node -e "process.exit($TAIL_START < $DUR - 0.001 ? 0 : 1)" && HAS_TAIL=1

          # Video and audio are spliced by different means, on purpose. Both
          # approaches below were verified locally against this exact material.
          #
          # VIDEO: stream-copied through MPEG-TS, which concatenates by plain
          # `cat`. The concat demuxer re-times each piece from its container
          # duration and gained 2 frames (1511 -> 1513); a raw Annex-B stream
          # lost 2 at the seams (1511 -> 1509) whatever the fps_mode. MPEG-TS
          # carries its own timing per packet and comes out exact. The head is
          # cut by frame count and the tail starts on a one-second keyframe, so
          # both are exact by construction and neither is re-encoded.
          #
          # AUDIO: cannot be stream-copied at all. An AAC frame is 1024 samples
          # (21.33 ms) and a video frame at 24 fps is 41.67 ms, so no cut lands
          # on both grids and every copied piece is padded out to a whole AAC
          # frame. So the audio is rebuilt with sample-accurate atrim and encoded
          # once. The patch's own audio must be trimmed to MID_LEN: its AAC track
          # runs 5.056 s for 5.000 s of video, and that 56 ms was sliding the
          # whole tail late.
          TS=""
          if [ "$S" -gt 0 ]; then
            ffmpeg -y -v error -i "$BASE" -frames:v "$S" -an -c:v copy -f mpegts splice/head.ts
            TS="$TS splice/head.ts"
          fi
          ffmpeg -y -v error -i "$PATCH" -an -c:v copy -f mpegts splice/mid.ts
          TS="$TS splice/mid.ts"
          if [ "$HAS_TAIL" = "1" ]; then
            ffmpeg -y -v error -ss "$TAIL_START" -i "$BASE" -an -c:v copy -f mpegts splice/tail.ts
            TS="$TS splice/tail.ts"
          fi
          echo "video pieces:$TS"
          cat $TS > splice/all.ts

          FILTER="[0:a]asplit=2[ah][at];"
          PARTS=""; N=0
          if [ "$S" -gt 0 ]; then
            FILTER="$FILTER[ah]atrim=end=$HEAD_END,asetpts=PTS-STARTPTS[a0];"
            PARTS="$PARTS[a0]"; N=$((N+1))
          else
            FILTER="$FILTER[ah]anullsink;"
          fi
          FILTER="$FILTER[1:a]atrim=end=$MID_LEN,asetpts=PTS-STARTPTS[a1];"
          PARTS="$PARTS[a1]"; N=$((N+1))
          if [ "$HAS_TAIL" = "1" ]; then
            FILTER="$FILTER[at]atrim=start=$TAIL_START,asetpts=PTS-STARTPTS[a2];"
            PARTS="$PARTS[a2]"; N=$((N+1))
          else
            FILTER="$FILTER[at]anullsink;"
          fi
          FILTER="$FILTER${PARTS}concat=n=$N:v=0:a=1[aout]"
          echo "audio filter: $FILTER"
          ffmpeg -y -v error -i "$BASE" -i "$PATCH" -filter_complex "$FILTER" \
            -map "[aout]" -c:a aac -b:a 320k splice/audio.m4a

          ffmpeg -y -v error -fflags +genpts -i splice/all.ts -i splice/audio.m4a \
            -c:v copy -c:a copy -fps_mode passthrough -movflags +faststart \
            out/${{ inputs.composition }}_spliced.mp4

          # The spliced file must be exactly as long as the base, frame for frame.
          BF=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$BASE" | tr -d ',')
          SF=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 out/${{ inputs.composition }}_spliced.mp4 | tr -d ',')
          echo "base frames: $BF   spliced frames: $SF"
          if [ "$BF" != "$SF" ]; then
            echo "::error::splice changed the frame count ($BF -> $SF)"; exit 1
          fi
          ls -la out

      - name: Report
        run: |
          echo "### Render complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| file | size | duration |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in out/*.mp4; do
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            S=$(du -h "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $S | ${D}s |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run id for splicing later: \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.name }}
          path: out/*.mp4
          retention-days: 30
          compression-level: 0
